  captions:
  - name: Build
    content: Used Bazel for builds, dependency management, caching, and custom rules across Python, C++,
      and Rust applications. Reduced incremental builds from over an hour to under a minute and moved
      production builds into GitLab CI/CD, delivering OCI runtime images.
    highlights:
    - over an hour
    - under a minute
  - name: Cloud
    content: Consolidated AWS infrastructure and introduced Terraform and Terragrunt. Reduced AWS costs
      through resource cleanup, autoscaling, and storage optimization.
  - name: Simulation
    content: Built cloud and CI infrastructure supporting growth from 1–5 to 1,000 concurrent real-time
      simulations, using AWS EKS, Karpenter, and Argo Workflows. Enabled automated simulation testing
      for merge requests and releases.
    highlights:
    - 1–5
    - 1,000 concurrent real-time simulations
  - name: Automation
    content: Automated vehicle host provisioning and configuration with Puppet and application deployments
      with Argo CD. Deployed Prometheus, Grafana Mimir, and Loki for monitoring, and introduced Tailscale
      with ACLs for remote access.
  - name: AI adoption
    content: Integrated coding agents into infrastructure migration and internal tool development. Set
      up agent-assisted GitLab and Terragrunt maintenance to summarize changes and assess upgrade risk,
      with human approval before execution.
  - name: NVIDIA Jetson
    content: Implemented Bazel support for parallel x86 and ARM production builds and tests, using dedicated
      on-premises NVIDIA Jetson Orin and Jetson Thor CI runners.
